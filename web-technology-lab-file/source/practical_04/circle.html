<h2 style="color:#1F4E79;">CIRCLE</h2>
<p>A circle is the set of all points which are at an equal distance (radius)
from a fixed point (centre).</p>
<p><b>Area</b> = pi x r<sup>2</sup> &nbsp;&nbsp; <b>Circumference</b> = 2 x pi
x r</p>
