<!DOCTYPE html>
<!-- menu.html : displayed in the LEFT frame -->
<!-- Every link uses target="main" so it opens in the right-hand frame -->
<html>
<head>
    <title>Menu</title>
    <style>
        body { margin:0; background-color:#F2F2F2; font-family:Verdana; }
        .head { background-color:#1F4E79; color:#FFFFFF; font-size:13px;
                font-weight:bold; padding:6px; text-align:center; }
        a    { display:block; padding:8px 10px; font-size:12px;
               color:#000000; text-decoration:none; border-bottom:1px solid #CCCCCC; }
        a:hover { background-color:#D9E1F2; color:#1F4E79; }
    </style>
</head>
<body>
    <div class="head">MAIN MENU</div>
    <a href="home.html"    target="main">Home</a>
    <a href="about.html"   target="main">About Us</a>
    <a href="courses.html" target="main">Courses</a>
    <a href="contact.html" target="main">Contact Us</a>
</body>
</html>
