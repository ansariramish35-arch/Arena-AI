<!DOCTYPE html>
<html>
<head>
  <title>Student Record Form with JavaScript Validation</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef3f8; }
    form {
      background: #fff; width: 430px; margin: 20px auto;
      padding: 20px; border: 2px solid #1f3864; border-radius: 8px;
    }
    h2 { text-align: center; color: #1f3864; }
    label { display: block; margin-top: 8px; font-weight: bold; }
    input, select {
      width: 100%; padding: 6px; margin-top: 3px;
      border: 1px solid #999; border-radius: 4px;
    }
    .error { color: red; font-size: 12px; }
    #result { text-align: center; font-weight: bold; color: green; }
  </style>
  <script>
    function validateForm() {
      var name = document.getElementById("name").value.trim();
      var roll = document.getElementById("roll").value.trim();
      var email = document.getElementById("email").value.trim();
      var phone = document.getElementById("phone").value.trim();
      var marks = document.getElementById("marks").value.trim();
      var err = "";

      // Name: letters and spaces only, at least 3 characters
      if (!/^[A-Za-z ]{3,}$/.test(name))
        err += "Name must contain letters only (min 3).\n";

      // Roll number: letters and digits only
      if (!/^[A-Za-z0-9]+$/.test(roll))
        err += "Roll No. must be alphanumeric.\n";

      // Email: standard pattern
      var mailRe = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
      if (!mailRe.test(email))
        err += "Enter a valid email address.\n";

      // Phone: exactly 10 digits
      if (!/^[0-9]{10}$/.test(phone))
        err += "Phone must be exactly 10 digits.\n";

      // Marks: number between 0 and 100
      if (isNaN(marks) || marks < 0 || marks > 100)
        err += "Marks must be a number between 0 and 100.\n";

      var out = document.getElementById("result");
      if (err !== "") {
        out.style.color = "red";
        out.innerHTML = "Errors:<br>" + err.replace(/\n/g, "<br>");
        return false;               // stop form submission
      }
      out.style.color = "green";
      out.innerHTML = "Record saved successfully for " + name + "!";
      return false;                 // demo: do not actually submit
    }
  </script>
</head>
<body>
  <form onsubmit="return validateForm()">
    <h2>Student Record</h2>

    <label>Name:</label>
    <input type="text" id="name">

    <label>Roll No.:</label>
    <input type="text" id="roll">

    <label>Email:</label>
    <input type="text" id="email">

    <label>Phone:</label>
    <input type="text" id="phone">

    <label>Marks (0-100):</label>
    <input type="text" id="marks">

    <label>Course:</label>
    <select id="course">
      <option>B.Tech CSE</option>
      <option>B.Tech IT</option>
    </select>

    <div style="text-align:center; margin-top:12px;">
      <input type="submit" value="Save Record" style="width:auto;">
    </div>
    <p id="result"></p>
  </form>
</body>
</html>
