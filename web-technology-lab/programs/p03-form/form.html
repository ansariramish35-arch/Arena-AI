<!DOCTYPE html>
<html>
<head>
  <title>Student Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef3f8; }
    form {
      background: #ffffff; width: 420px; margin: 20px auto;
      padding: 20px; border: 2px solid #1f3864; border-radius: 8px;
    }
    h2 { text-align: center; color: #1f3864; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select, textarea {
      width: 100%; padding: 6px; margin-top: 4px;
      border: 1px solid #999; border-radius: 4px;
    }
    .btns { text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h2>Student Registration Form</h2>

    <label>Full Name:</label>
    <input type="text" name="name" placeholder="Enter full name">

    <label>Password:</label>
    <input type="password" name="password">

    <label>Gender:</label>
    <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female"> Female

    <label>Hobbies:</label>
    <input type="checkbox" name="hobby" value="Reading"> Reading
    <input type="checkbox" name="hobby" value="Sports"> Sports
    <input type="checkbox" name="hobby" value="Music"> Music

    <label>Course:</label>
    <select name="course">
      <option>B.Tech CSE</option>
      <option>B.Tech IT</option>
      <option>B.Tech ECE</option>
    </select>

    <label>Address:</label>
    <textarea name="address" rows="3"></textarea>

    <label>Upload Photo:</label>
    <input type="file" name="photo">

    <div class="btns">
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </div>
  </form>
</body>
</html>
